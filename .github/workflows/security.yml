name: Security regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        testbench: ['^10.12', '^11.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --with 'orchestra/testbench:${{ matrix.testbench }}' --prefer-dist --no-interaction --no-plugins --no-scripts
      - run: composer audit
      - run: vendor/bin/phpunit --fail-on-warning --fail-on-risky --fail-on-deprecation --fail-on-phpunit-deprecation --fail-on-phpunit-notice
      - name: Lint PHP source
        run: find src config tests -name '*.php' -print0 | xargs -0 -n1 php -l
  module-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: composer update --no-interaction --no-plugins --no-scripts --prefer-dist
      - run: php tools/module-build-fixture.php "$RUNNER_TEMP/ddd-module-assets"
      - run: npm install --ignore-scripts --prefix "$RUNNER_TEMP/ddd-module-assets/src/Domain/Blog"
      - run: npm audit --prefix "$RUNNER_TEMP/ddd-module-assets/src/Domain/Blog"
      - run: npm run build --prefix "$RUNNER_TEMP/ddd-module-assets/src/Domain/Blog"
      - run: php tools/module-build-fixture.php "$RUNNER_TEMP/ddd-module-assets" --verify
